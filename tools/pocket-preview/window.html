<!doctype html><html><body style="margin:0;background:#000">
<!-- Runs a .mat fragment block (Filament material syntax) in WebGL2, framed as the phone sees the
     window plane. Driven by render_window.js; see README.md. -->
<canvas id="c"></canvas>
<script>
// Renders a .mat fragment block (Filament material syntax) in WebGL2, framed as the phone sees it.
async function run() {
  const q = new URLSearchParams(location.search);
  const W = +q.get('w') || 720, H = +q.get('h') || 1560;
  const visW = +q.get('vw'), visH = +q.get('vh');
  const plane = (q.get('size') || '0.5,0.7').split(',').map(Number);
  const scroll = q.get('scroll').split(',').map(Number);
  const bob = (q.get('bob') || '0,0').split(',').map(Number);
  const gain = +(q.get('gain') || 0.8);
  let frag = window.__frag;
  const c = document.getElementById('c'); c.width = W; c.height = H;
  const gl = c.getContext('webgl2', { preserveDrawingBuffer: true });
  if (!gl.getExtension('EXT_color_buffer_float')) throw new Error('no float buffers');
  const fs = `#version 300 es
precision highp float;
uniform vec2 u_res; uniform vec2 u_vis;
struct MaterialParams { vec2 size; vec4 scroll; vec2 bob; float gain; };
uniform MaterialParams materialParams;
struct MaterialInputs { vec4 baseColor; };
void prepareMaterial(inout MaterialInputs m) {}
vec2 g_uv;
float sq(float x) { return x * x; }  // Filament common_math
vec2 getUV0() { return g_uv; }
${frag}
out vec4 outColor;
void main() {
  // Pixel -> plane metres -> the plane's own UV (V running downward, as SceneView's PlaneNode does).
  vec2 f = gl_FragCoord.xy / u_res;            // 0..1, y up
  vec2 p = vec2((f.x - 0.5) * u_vis.x, (f.y - 0.5) * u_vis.y);
  g_uv = vec2(p.x / materialParams.size.x + 0.5, 0.5 - p.y / materialParams.size.y);
  MaterialInputs m; m.baseColor = vec4(0.0);
  material(m);
  outColor = vec4(m.baseColor.rgb, 1.0);
}`;
  const vs = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;
  function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr); if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(pr, n);
  gl.uniform2f(U('u_res'), W, H); gl.uniform2f(U('u_vis'), visW, visH);
  gl.uniform2f(U('materialParams.size'), plane[0], plane[1]);
  gl.uniform4f(U('materialParams.scroll'), ...scroll);
  gl.uniform2f(U('materialParams.bob'), ...bob);
  gl.uniform1f(U('materialParams.gain'), gain);
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, W, H, 0, gl.RGBA, gl.FLOAT, null);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.viewport(0, 0, W, H); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  const px = new Float32Array(W * H * 4); gl.readPixels(0, 0, W, H, gl.RGBA, gl.FLOAT, px);
  window.__pixels = px; document.body.dataset.ready = '1';
}
run().catch(e => { document.body.dataset.error = e.message; console.log('ERR', e.message); });
</script></body></html>
